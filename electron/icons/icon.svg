<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0a0a1a"/>
      <stop offset="100%" style="stop-color:#1a1a3e"/>
    </linearGradient>
    <linearGradient id="accent" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#00d4ff"/>
      <stop offset="100%" style="stop-color:#0066ff"/>
    </linearGradient>
  </defs>
  <rect width="512" height="512" rx="100" fill="url(#bg)"/>
  <!-- WiFi waves -->
  <g fill="none" stroke="url(#accent)" stroke-width="24" stroke-linecap="round">
    <path d="M 150 280 Q 256 180 362 280" opacity="0.4"/>
    <path d="M 185 310 Q 256 240 327 310" opacity="0.7"/>
    <path d="M 220 340 Q 256 300 292 340"/>
  </g>
  <!-- Center dot -->
  <circle cx="256" cy="370" r="20" fill="url(#accent)"/>
  <!-- H letter -->
  <text x="256" y="200" text-anchor="middle" font-family="Arial" font-weight="bold" font-size="120" fill="url(#accent)" opacity="0.3">H</text>
</svg>
