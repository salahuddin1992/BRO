<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>هيلين WiFi</title>
<style>
* { margin:0; padding:0; box-sizing:border-box; }
:root { --bg:#0a0a1a; --card:rgba(255,255,255,0.04); --border:rgba(255,255,255,0.08);
        --text:#e0e0e0; --dim:rgba(255,255,255,0.4); --accent:#00d4ff; --green:#00e676;
        --red:#ff5252; --orange:#ff9100; --yellow:#ffd600; --purple:#b388ff; }
body { font-family:'Segoe UI',Tahoma,sans-serif; background:var(--bg); color:var(--text); height:100vh; overflow:hidden; }

/* Connection status bar */
.conn-bar { position:fixed; top:0; left:0; right:0; padding:8px; text-align:center; font-size:.82em;
            background:var(--red); color:#fff; z-index:300; transform:translateY(-100%); transition:transform .3s; }
.conn-bar.on { transform:translateY(0); }

/* Auth Screen */
.auth { position:fixed; inset:0; background:rgba(0,0,0,0.92); display:flex; align-items:center; justify-content:center; z-index:100; }
.auth.hide { display:none; }
.auth-box { background:var(--card); border:1px solid var(--border); border-radius:16px; padding:40px; text-align:center; width:340px;
            backdrop-filter:blur(20px); }
.auth-box h2 { color:var(--accent); margin-bottom:6px; }
.auth-box .subtitle { color:var(--dim); font-size:.82em; margin-bottom:20px; }
.auth-box input { width:100%; padding:12px; background:rgba(255,255,255,0.07); border:1px solid var(--border);
                  border-radius:10px; color:#fff; font-size:1em; outline:none; margin-bottom:10px; }
.auth-box input:focus { border-color:var(--accent); }
.auth-box .abtn { width:100%; padding:12px; border:none; border-radius:10px; color:#fff; font-size:1em; cursor:pointer; margin-bottom:8px; }
.auth-box .abtn.primary { background:linear-gradient(135deg,#00d4ff,#0066ff); }
.auth-box .abtn.secondary { background:rgba(255,255,255,0.08); }
.auth-box .abtn.secondary:hover { background:rgba(255,255,255,0.12); }
.auth-error { background:rgba(255,50,50,0.15); border:1px solid rgba(255,50,50,0.25); color:var(--red);
              padding:8px; border-radius:8px; font-size:.85em; margin-bottom:12px; display:none; }
.auth-tabs { display:flex; gap:4px; margin-bottom:18px; }
.auth-tabs button { flex:1; padding:8px; background:rgba(255,255,255,0.05); border:1px solid var(--border);
                    border-radius:8px; color:var(--dim); cursor:pointer; font-size:.88em; }
.auth-tabs button.on { background:rgba(0,212,255,0.1); border-color:var(--accent); color:var(--accent); }

/* Layout */
.app { display:grid; grid-template-columns:220px 1fr 260px; height:100vh; }

/* Sidebar - Users & Rooms */
.sidebar { background:rgba(255,255,255,0.02); border-left:1px solid var(--border); display:flex; flex-direction:column; overflow:hidden; }
.sec-title { font-size:.78em; color:var(--dim); text-transform:uppercase; letter-spacing:1px; padding:10px 14px 6px;
             border-bottom:1px solid var(--border); display:flex; justify-content:space-between; align-items:center; }
.sec-title button { background:none; border:none; color:var(--accent); cursor:pointer; font-size:1.1em; padding:0 4px; }

/* Status selector */
.my-status { padding:10px 14px; border-bottom:1px solid var(--border); display:flex; align-items:center; gap:8px; }
.my-status select { background:rgba(255,255,255,0.06); border:1px solid var(--border); color:var(--text);
                    border-radius:6px; padding:4px 8px; font-size:.78em; outline:none; }

/* Rooms list */
.rooms-list { overflow-y:auto; max-height:40%; border-bottom:1px solid var(--border); }
.room { display:flex; align-items:center; gap:8px; padding:8px 14px; cursor:pointer; font-size:.85em; }
.room:hover { background:rgba(255,255,255,0.04); }
.room.sel { background:rgba(0,212,255,0.1); }
.room-icon { width:28px; height:28px; background:rgba(0,212,255,0.15); border-radius:6px;
             display:flex; align-items:center; justify-content:center; font-size:.8em; color:var(--accent); }

/* Users list */
.users-list { flex:1; overflow-y:auto; padding-bottom:10px; }
.user { display:flex; align-items:center; gap:8px; padding:8px 14px; border-radius:8px; cursor:pointer; margin:0 4px 2px; }
.user:hover { background:rgba(255,255,255,0.04); }
.user.sel { background:rgba(0,212,255,0.1); }
.avatar { width:32px; height:32px; background:linear-gradient(135deg,#00d4ff,#0066ff); border-radius:50%;
          display:flex; align-items:center; justify-content:center; font-weight:bold; font-size:.85em; position:relative; }
.status-dot { position:absolute; bottom:-1px; right:-1px; width:10px; height:10px; border-radius:50%;
              border:2px solid var(--bg); }
.status-dot.online { background:var(--green); }
.status-dot.away { background:var(--yellow); }
.status-dot.busy { background:var(--red); }
.status-dot.offline { background:#555; }
.uname { font-size:.85em; }
.rbadge { font-size:.58em; background:rgba(0,212,255,0.15); color:var(--accent); padding:1px 5px; border-radius:6px; margin-right:4px; }

/* Center */
.center { display:flex; flex-direction:column; }
.topbar { display:flex; align-items:center; justify-content:space-between; padding:10px 18px; border-bottom:1px solid var(--border); gap:10px; }
.topbar .target { font-size:.9em; color:var(--dim); }
.btns { display:flex; gap:6px; align-items:center; }
.cbtn { width:38px; height:38px; border-radius:50%; border:none; cursor:pointer; font-size:1.1em;
        display:flex; align-items:center; justify-content:center; }
.cbtn.voice { background:var(--green); color:#fff; }
.cbtn.video { background:var(--accent); color:#fff; }
.cbtn.hangup { background:var(--red); color:#fff; display:none; }

/* Call timer */
.call-timer { display:none; color:var(--green); font-family:monospace; font-size:.82em; letter-spacing:1px; }
.call-timer.on { display:inline-block; animation:pulse 2s infinite; }
@keyframes pulse { 0%,100%{opacity:1;} 50%{opacity:.6;} }

/* Video */
.vid-area { display:none; background:#000; position:relative; max-height:45vh; }
.vid-area.on { display:flex; }
#remoteVid { width:100%; height:100%; object-fit:cover; }
#localVid { position:absolute; bottom:10px; left:10px; width:150px; border-radius:8px; border:2px solid var(--accent); z-index:5; }
.vid-ctrl { position:absolute; bottom:10px; left:50%; transform:translateX(-50%); display:flex; gap:10px; z-index:5; }
.vbtn { width:42px; height:42px; border-radius:50%; border:none; cursor:pointer; font-size:1.1em;
        background:rgba(255,255,255,0.15); color:#fff; }
.vbtn.off { background:var(--red); }

/* Chat */
.chat { flex:1; display:flex; flex-direction:column; min-height:0; }
.msgs { flex:1; overflow-y:auto; padding:14px 18px; }
.msg { max-width:65%; padding:9px 14px; border-radius:14px; margin-bottom:6px; font-size:.88em; line-height:1.4; word-wrap:break-word; }
.msg.out { background:linear-gradient(135deg,#0066ff,#00d4ff); margin-left:auto; color:#fff; }
.msg.in { background:rgba(255,255,255,0.07); margin-right:auto; }
.msg .who { font-size:.72em; color:rgba(255,255,255,0.4); margin-bottom:3px; }
.msg .when { font-size:.68em; color:rgba(255,255,255,0.25); margin-top:3px; direction:ltr; text-align:left; }
.sys { text-align:center; color:var(--dim); font-size:.78em; padding:6px; }
.file-msg { background:rgba(0,212,255,0.08); border:1px solid rgba(0,212,255,0.15); }
.file-msg a { color:var(--accent); text-decoration:none; }

/* Typing indicator */
.typing-bar { padding:0 18px; min-height:20px; font-size:.75em; color:var(--accent); }

/* Upload progress */
.upload-bar { display:none; padding:6px 18px; border-top:1px solid var(--border); }
.upload-bar.on { display:block; }
.pbar { width:100%; height:5px; background:rgba(255,255,255,0.08); border-radius:3px; overflow:hidden; }
.pfill { height:100%; background:linear-gradient(90deg,#00d4ff,#0066ff); width:0%; transition:width .2s; }
.ptext { font-size:.72em; color:var(--dim); margin-top:3px; display:flex; justify-content:space-between; }

/* Input */
.input-row { display:flex; gap:8px; padding:10px 18px; border-top:1px solid var(--border); align-items:center; }
.input-row input[type=text] { flex:1; padding:10px 14px; background:rgba(255,255,255,0.06); border:1px solid var(--border);
                              border-radius:20px; color:#fff; font-size:.9em; outline:none; }
.input-row input:focus { border-color:var(--accent); }
.sbtn { width:40px; height:40px; border-radius:50%; border:none; background:linear-gradient(135deg,#00d4ff,#0066ff);
        color:#fff; font-size:1.1em; cursor:pointer; }
.fbtn { width:40px; height:40px; border-radius:50%; border:1px solid var(--border); background:transparent;
        color:var(--dim); font-size:1.1em; cursor:pointer; }

/* Info panel */
.info { background:rgba(255,255,255,0.02); border-right:1px solid var(--border); padding:14px; overflow-y:auto; }
.info-card { background:rgba(0,212,255,0.04); border:1px solid rgba(0,212,255,0.08); border-radius:10px; padding:14px; margin-bottom:14px; }
.info-card h3 { color:var(--accent); font-size:.82em; margin-bottom:6px; }
.irow { display:flex; justify-content:space-between; padding:4px 0; font-size:.78em; border-bottom:1px solid rgba(255,255,255,0.03); }
.irow .l { color:var(--dim); }
.irow .v { direction:ltr; font-family:monospace; }

/* Incoming call */
.call-popup { position:fixed; inset:0; background:rgba(0,0,0,0.85); display:none; align-items:center; justify-content:center; z-index:200; }
.call-popup.on { display:flex; }
.call-card { text-align:center; padding:40px; }
.call-card h2 { color:var(--accent); margin-bottom:8px; }
.call-card p { color:var(--dim); margin-bottom:24px; }
.call-card .row { display:flex; gap:20px; justify-content:center; }
.call-card button { width:56px; height:56px; border-radius:50%; border:none; cursor:pointer; font-size:1.4em; }
.acc { background:var(--green); color:#fff; }
.rej { background:var(--red); color:#fff; }

/* Room create modal */
.modal-overlay { position:fixed; inset:0; background:rgba(0,0,0,0.7); display:none; align-items:center; justify-content:center; z-index:150; }
.modal-overlay.on { display:flex; }
.modal { background:#1a1a2e; border:1px solid var(--border); border-radius:14px; padding:30px; width:320px; }
.modal h3 { color:var(--accent); margin-bottom:16px; text-align:center; }
.modal input { width:100%; padding:10px; background:rgba(255,255,255,0.07); border:1px solid var(--border);
               border-radius:8px; color:#fff; font-size:.9em; outline:none; margin-bottom:10px; }
.modal button { width:100%; padding:10px; border:none; border-radius:8px; color:#fff; cursor:pointer; margin-bottom:6px; }
.modal .mbtn-ok { background:linear-gradient(135deg,#00d4ff,#0066ff); }
.modal .mbtn-cancel { background:rgba(255,255,255,0.08); }

/* Mobile toggle */
.mob-btn { display:none; position:fixed; top:10px; right:10px; z-index:60; width:38px; height:38px;
           border-radius:50%; border:1px solid var(--border); background:rgba(10,10,26,0.9);
           color:var(--accent); font-size:1.3em; cursor:pointer; align-items:center; justify-content:center; }

@media(max-width:768px) {
    .app { grid-template-columns:1fr; }
    .sidebar { display:none; position:fixed; top:0; right:0; width:280px; height:100vh; z-index:50;
             background:var(--bg); border-left:1px solid var(--border); box-shadow:-4px 0 20px rgba(0,0,0,0.6); }
    .sidebar.mob-on { display:flex; }
    .info { display:none; }
    .mob-btn { display:flex; }
    #localVid { width:100px; }
}
</style>
</head>
<body>

<!-- Connection Status -->
<div class="conn-bar" id="connBar">انقطع الاتصال... جاري إعادة الاتصال</div>

<!-- Mobile Toggle -->
<button class="mob-btn" id="mobBtn" onclick="toggleMobile()">&#9776;</button>

<!-- Auth Screen -->
<div class="auth" id="authScreen">
    <div class="auth-box">
        <h2>هيلين WiFi</h2>
        <div class="subtitle">اتصال داخلي</div>
        <div class="auth-tabs">
            <button class="on" id="tabLogin" onclick="switchTab('login')">دخول</button>
            <button id="tabRegister" onclick="switchTab('register')">تسجيل جديد</button>
        </div>
        <div class="auth-error" id="authError"></div>
        <input id="authUser" placeholder="اسم المستخدم" autofocus>
        <input id="authPass" type="password" placeholder="كلمة المرور">
        <button class="abtn primary" id="authBtn" onclick="doAuth()">دخول</button>
    </div>
</div>

<!-- Room Create Modal -->
<div class="modal-overlay" id="roomModal">
    <div class="modal">
        <h3>غرفة جديدة</h3>
        <input id="roomNameIn" placeholder="اسم الغرفة">
        <input id="roomDescIn" placeholder="وصف (اختياري)">
        <button class="mbtn-ok" onclick="createRoom()">إنشاء</button>
        <button class="mbtn-cancel" onclick="closeRoomModal()">إلغاء</button>
    </div>
</div>

<!-- Incoming Call -->
<div class="call-popup" id="callPopup">
    <div class="call-card">
        <h2 id="callerName">مكالمة واردة</h2>
        <p id="callTypeText">مكالمة فيديو</p>
        <div class="row">
            <button class="acc" onclick="acceptCall()">&#128222;</button>
            <button class="rej" onclick="rejectCall()">&#10005;</button>
        </div>
    </div>
</div>

<!-- App -->
<div class="app">
    <div class="sidebar" id="sidebarPanel">
        <!-- My Status -->
        <div class="my-status">
            <span style="font-size:.82em;">حالتي:</span>
            <select id="myStatus" onchange="setMyStatus(this.value)">
                <option value="online">متصل</option>
                <option value="away">بعيد</option>
                <option value="busy">مشغول</option>
            </select>
        </div>

        <!-- Rooms -->
        <div class="sec-title">الغرف <button onclick="openRoomModal()" title="غرفة جديدة">+</button></div>
        <div class="rooms-list" id="roomList"></div>

        <!-- Users -->
        <div class="sec-title">المتصلون</div>
        <div class="users-list" id="userList"></div>
    </div>

    <div class="center">
        <div class="topbar">
            <span class="target" id="chatTarget">عامة</span>
            <span class="call-timer" id="callTimer">00:00</span>
            <div class="btns">
                <button class="cbtn voice" onclick="startCall('audio')" title="صوت">&#128222;</button>
                <button class="cbtn video" onclick="startCall('video')" title="فيديو">&#127909;</button>
                <button class="cbtn hangup" id="hangupBtn" onclick="endCall()">&#10005;</button>
            </div>
        </div>

        <div class="vid-area" id="vidArea">
            <video id="remoteVid" autoplay playsinline></video>
            <video id="localVid" autoplay muted playsinline></video>
            <div class="vid-ctrl">
                <button class="vbtn" id="micBtn" onclick="toggleMic()">&#127908;</button>
                <button class="vbtn" id="camBtn" onclick="toggleCam()">&#127909;</button>
                <button class="vbtn" onclick="toggleFullscreen()" title="ملء الشاشة">&#x26F6;</button>
                <button class="vbtn off" onclick="endCall()">&#10005;</button>
            </div>
        </div>

        <div class="chat">
            <div class="msgs" id="msgs"></div>
            <div class="typing-bar" id="typingBar"></div>
            <div class="upload-bar" id="uploadBar">
                <div class="pbar"><div class="pfill" id="pFill"></div></div>
                <div class="ptext"><span id="pName">...</span><span id="pPct">0%</span></div>
            </div>
            <div class="input-row">
                <input type="file" id="fileIn" style="display:none" onchange="sendFile()">
                <button class="fbtn" onclick="document.getElementById('fileIn').click()">&#128206;</button>
                <input type="text" id="msgIn" placeholder="اكتب رسالتك..." onkeydown="handleMsgKey(event)" oninput="handleTyping()">
                <button class="sbtn" onclick="sendMsg()">&#10148;</button>
            </div>
        </div>
    </div>

    <div class="info">
        <div class="sec-title" style="padding:0 0 6px;">معلومات</div>
        <div class="info-card">
            <h3>السيرفر</h3>
            <div class="irow"><span class="l">المعرف</span><span class="v" id="iServerId">--</span></div>
            <div class="irow"><span class="l">الاتصال</span><span class="v" id="iFiber">--</span></div>
        </div>
        <div class="info-card">
            <h3>احصائيات</h3>
            <div class="irow"><span class="l">متصلون</span><span class="v" id="iOnline">0</span></div>
            <div class="irow"><span class="l">رسائل</span><span class="v" id="iMsgs">0</span></div>
            <div class="irow"><span class="l">ملفات</span><span class="v" id="iFiles">0</span></div>
        </div>
        <div class="sec-title" style="padding:10px 0 6px;">ملفات مشتركة</div>
        <div id="sharedFiles"></div>
    </div>
</div>

<script src="/static/js/socket.io.min.js"></script>
<script>
let socket, me;
let selUser=null, selUserName=null, selRoom=null;
let localStream, pc, inCall=null;
let micOn=true, camOn=true;
let msgCount=0, fileCount=0;
let iceQ=[], lastUsers=[], myRooms=[];
let callTimerInt=null, callStart=null;
let authMode='login';
let typingTimeout=null, isTyping=false;
let notifGranted=false;

let iceConfig = {iceServers:[]};

// --- Notifications ---
function requestNotif(){
    if('Notification' in window && Notification.permission==='default'){
        Notification.requestPermission().then(p=>{ notifGranted=(p==='granted'); });
    } else {
        notifGranted = (Notification.permission==='granted');
    }
}
function showNotif(title,body){
    if(!notifGranted || document.hasFocus()) return;
    try { new Notification(title, {body, icon:'data:image/svg+xml,<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100"><text y=".9em" font-size="90">📡</text></svg>'}); } catch(e){}
}

// --- Auth ---
function switchTab(mode){
    authMode=mode;
    document.getElementById('tabLogin').classList.toggle('on', mode==='login');
    document.getElementById('tabRegister').classList.toggle('on', mode==='register');
    document.getElementById('authBtn').textContent = mode==='login' ? 'دخول' : 'تسجيل';
    document.getElementById('authError').style.display='none';
}

function doAuth(){
    let user = document.getElementById('authUser').value.trim();
    let pass = document.getElementById('authPass').value;
    if(!user||!pass){ showAuthError('الاسم وكلمة المرور مطلوبين'); return; }
    initSocket(user, pass);
}

function showAuthError(msg){
    let el = document.getElementById('authError');
    el.textContent=msg; el.style.display='block';
}

document.getElementById('authUser').addEventListener('keydown', e=>{ if(e.key==='Enter') document.getElementById('authPass').focus(); });
document.getElementById('authPass').addEventListener('keydown', e=>{ if(e.key==='Enter') doAuth(); });

// --- Ringtone (Web Audio API) ---
let ringCtx, ringOscArr, ringGain, ringTimer;
function startRing(){
    try {
        ringCtx = new (window.AudioContext || window.webkitAudioContext)();
        ringGain = ringCtx.createGain();
        ringGain.connect(ringCtx.destination);
        ringGain.gain.value = 0.15;
        let o1 = ringCtx.createOscillator();
        o1.type='sine'; o1.frequency.value=440; o1.connect(ringGain); o1.start();
        let o2 = ringCtx.createOscillator();
        o2.type='sine'; o2.frequency.value=480; o2.connect(ringGain); o2.start();
        ringOscArr=[o1,o2];
        let on=true;
        ringTimer = setInterval(()=>{
            on=!on;
            ringGain.gain.setTargetAtTime(on?0.15:0, ringCtx.currentTime, 0.02);
        }, 800);
    } catch(e){}
}
function stopRing(){
    if(ringTimer) clearInterval(ringTimer);
    if(ringOscArr) ringOscArr.forEach(o=>{ try{o.stop();}catch(e){} });
    if(ringCtx) try{ringCtx.close();}catch(e){}
    ringCtx=ringOscArr=ringGain=ringTimer=null;
}

// --- Call Timer ---
function startCallTimer(){
    callStart = Date.now();
    document.getElementById('callTimer').classList.add('on');
    callTimerInt = setInterval(()=>{
        let s = Math.floor((Date.now()-callStart)/1000);
        let m = Math.floor(s/60); s=s%60;
        document.getElementById('callTimer').textContent =
            String(m).padStart(2,'0')+':'+String(s).padStart(2,'0');
    }, 1000);
}
function stopCallTimer(){
    if(callTimerInt) clearInterval(callTimerInt);
    callTimerInt=null; callStart=null;
    document.getElementById('callTimer').classList.remove('on');
    document.getElementById('callTimer').textContent = '00:00';
}

// --- Mobile ---
function toggleMobile(){ document.getElementById('sidebarPanel').classList.toggle('mob-on'); }

// --- Fullscreen ---
function toggleFullscreen(){
    let el = document.getElementById('vidArea');
    if(document.fullscreenElement) document.exitFullscreen();
    else if(el.requestFullscreen) el.requestFullscreen();
    else if(el.webkitRequestFullscreen) el.webkitRequestFullscreen();
}

// --- Socket ---
function initSocket(user, pass){
    socket = io({reconnection:true, reconnectionDelay:1000, reconnectionAttempts:Infinity});

    socket.on('connect', ()=>{
        document.getElementById('connBar').classList.remove('on');
        socket.emit(authMode==='register'?'auth_register':'auth_login', {username:user, password:pass});
    });

    socket.on('disconnect', ()=>{
        document.getElementById('connBar').classList.add('on');
    });

    socket.on('auth_result', d=>{
        if(d.ok){
            me = d.username;
            myRooms = d.rooms || [];
            document.getElementById('authScreen').classList.add('hide');
            requestNotif();
            renderRooms();
            // Select general room by default
            if(myRooms.length>0){
                selectRoom(myRooms[0].id, myRooms[0].name);
            }
        } else {
            showAuthError(d.error);
            socket.disconnect();
        }
    });

    socket.on('server_info', d=>{
        document.getElementById('iServerId').textContent = d.server_id;
        if(d.ice_servers) iceConfig.iceServers = d.ice_servers;
        document.getElementById('iFiber').textContent = d.is_fiber ? 'فايبر' : 'عادي';
        document.getElementById('iFiber').style.color = d.is_fiber ? 'var(--green)' : '';
    });

    socket.on('users_online', d=>{
        lastUsers = d.users;
        renderUsers(d.users);
        document.getElementById('iOnline').textContent = d.users.length;
    });

    socket.on('user_offline', d=>{
        if(d.username) sysMsg(d.username+' غادر');
        if(d.sid===inCall){ sysMsg('انتهت المكالمة'); cleanup(); }
    });

    socket.on('chat_message', d=>{
        msgCount++;
        document.getElementById('iMsgs').textContent = msgCount;
        // Show only if message belongs to current view
        if(shouldShowMsg(d)){
            addMsg(d.sender, d.text, d.sender===me, d.timestamp);
        }
        if(d.sender!==me) showNotif(d.sender, d.text);
    });

    socket.on('file_shared', d=>{
        fileCount++;
        document.getElementById('iFiles').textContent = fileCount;
        fileMsg(d);
        addShared(d);
        if(d.uploaded_by!==me) showNotif(d.uploaded_by, 'شارك ملف: '+d.name);
    });

    socket.on('rooms_updated', d=>{
        myRooms = d.rooms;
        renderRooms();
    });

    socket.on('room_created', d=>{
        // New room available - could show notification
    });

    socket.on('room_history', d=>{
        document.getElementById('msgs').innerHTML='';
        (d.messages||[]).forEach(m=> addMsg(m.sender, m.text, m.sender===me, m.timestamp));
        (d.files||[]).forEach(f=> fileMsg(f));
    });

    socket.on('dm_history', d=>{
        document.getElementById('msgs').innerHTML='';
        (d.messages||[]).forEach(m=> addMsg(m.sender, m.text, m.sender===me, m.timestamp));
    });

    socket.on('all_rooms', d=>{
        showJoinRoomsList(d.rooms);
    });

    // Typing
    socket.on('user_typing', d=>{
        if(shouldShowTyping(d)){
            document.getElementById('typingBar').textContent = d.username + ' يكتب...';
        }
    });
    socket.on('user_stop_typing', d=>{
        document.getElementById('typingBar').textContent = '';
    });

    // WebRTC
    socket.on('incoming_call', d=>{
        inCall = d.sender;
        document.getElementById('callerName').textContent = d.sender_name;
        document.getElementById('callTypeText').textContent = d.call_type==='video'?'مكالمة فيديو':'مكالمة صوتية';
        document.getElementById('callPopup').classList.add('on');
        window._callType = d.call_type;
        startRing();
        showNotif('مكالمة واردة', d.sender_name);
    });

    socket.on('call_accepted', async d=>{ await createOffer(d.sender); });
    socket.on('call_rejected', ()=>{ sysMsg('تم رفض المكالمة'); cleanup(); });
    socket.on('call_ended', ()=>{ sysMsg('انتهت المكالمة'); cleanup(); });
    socket.on('webrtc_offer', async d=> await handleOffer(d));
    socket.on('webrtc_answer', async d=> await handleAnswer(d));
    socket.on('webrtc_ice', async d=> await handleIce(d));
}

// --- Should show message in current view ---
function shouldShowMsg(d){
    if(selRoom && d.room_id==selRoom) return true;
    if(selUserName && !d.room_id && (d.sender===selUserName || d.target_user===selUserName)) return true;
    if(!selRoom && !selUserName && !d.room_id && !d.target_user) return true;
    return false;
}
function shouldShowTyping(d){
    if(selRoom && d.room_id==selRoom) return true;
    if(selUserName && !d.room_id && d.username===selUserName) return true;
    return false;
}

// --- Rooms ---
function renderRooms(){
    document.getElementById('roomList').innerHTML = myRooms.map(r=>
        `<div class="room ${selRoom===r.id?'sel':''}" onclick="selectRoom(${r.id},'${esc(r.name)}')">
            <div class="room-icon">#</div>
            <span>${esc(r.name)}</span>
        </div>`
    ).join('');
}

function selectRoom(id, name){
    selRoom=id; selUserName=null; selUser=null;
    document.getElementById('chatTarget').textContent = '# '+name;
    document.getElementById('msgs').innerHTML='';
    document.getElementById('typingBar').textContent='';
    renderRooms();
    renderUsers(lastUsers);
    socket.emit('get_room_history', {room_id:id});
    document.getElementById('sidebarPanel').classList.remove('mob-on');
}

function openRoomModal(){ document.getElementById('roomModal').classList.add('on'); }
function closeRoomModal(){ document.getElementById('roomModal').classList.remove('on'); }

function createRoom(){
    let name = document.getElementById('roomNameIn').value.trim();
    let desc = document.getElementById('roomDescIn').value.trim();
    if(!name) return;
    socket.emit('create_room', {name, description:desc});
    document.getElementById('roomNameIn').value='';
    document.getElementById('roomDescIn').value='';
    closeRoomModal();
}

// --- Users ---
function renderUsers(users){
    document.getElementById('userList').innerHTML = users.filter(u=>u.username!==me).map(u=>
        `<div class="user ${selUser===u.sid?'sel':''}" onclick="pickUser('${u.sid}','${esc(u.username)}')">
            <div class="avatar">${u.username[0].toUpperCase()}<span class="status-dot ${u.status||'online'}"></span></div>
            <div class="uname">${esc(u.username)}${u.remote?'<span class="rbadge">mesh</span>':''}</div>
        </div>`
    ).join('');
}

function pickUser(sid,name){
    if(selUser===sid){ selUser=null; selUserName=null; }
    else { selUser=sid; selUserName=name; selRoom=null; }
    document.getElementById('chatTarget').textContent = selUser ? name : (myRooms.length ? '# '+myRooms[0].name : 'عامة');
    document.getElementById('msgs').innerHTML='';
    document.getElementById('typingBar').textContent='';
    renderUsers(lastUsers);
    renderRooms();
    if(selUserName){
        socket.emit('get_dm_history', {username:selUserName});
    } else if(myRooms.length){
        selRoom = myRooms[0].id;
        renderRooms();
        socket.emit('get_room_history', {room_id:selRoom});
    }
    document.getElementById('sidebarPanel').classList.remove('mob-on');
}

// --- Status ---
function setMyStatus(status){
    if(socket) socket.emit('set_status', {status});
}

// --- Typing ---
function handleTyping(){
    if(!socket) return;
    if(!isTyping){
        isTyping=true;
        if(selUser) socket.emit('typing', {target_sid:selUser});
        else if(selRoom) socket.emit('typing', {room_id:selRoom});
    }
    clearTimeout(typingTimeout);
    typingTimeout = setTimeout(()=>{
        isTyping=false;
        if(selUser) socket.emit('stop_typing', {target_sid:selUser});
        else if(selRoom) socket.emit('stop_typing', {room_id:selRoom});
    }, 2000);
}

function handleMsgKey(e){
    if(e.key==='Enter') sendMsg();
}

// --- Chat ---
function sendMsg(){
    let input = document.getElementById('msgIn');
    let text = input.value.trim();
    if(!text) return;
    let payload = {text};
    if(selUserName) payload.target_user = selUserName;
    else if(selRoom) payload.room_id = selRoom;
    socket.emit('chat_message', payload);
    input.value='';
    // Stop typing
    isTyping=false;
    clearTimeout(typingTimeout);
    if(selUser) socket.emit('stop_typing', {target_sid:selUser});
    else if(selRoom) socket.emit('stop_typing', {room_id:selRoom});
}

function addMsg(sender,text,mine,ts){
    let c = document.getElementById('msgs');
    let t = ts ? new Date(ts+'Z').toLocaleTimeString('ar-SA') : '';
    let d = document.createElement('div');
    d.className = 'msg '+(mine?'out':'in');
    d.innerHTML = (mine?'':`<div class="who">${esc(sender)}</div>`)+`<div>${esc(text)}</div><div class="when">${t}</div>`;
    c.appendChild(d);
    c.scrollTop = c.scrollHeight;
}

function sysMsg(text){
    let c = document.getElementById('msgs');
    let d = document.createElement('div');
    d.className='sys'; d.textContent=text;
    c.appendChild(d);
    c.scrollTop = c.scrollHeight;
}

function fileMsg(data){
    let c = document.getElementById('msgs');
    let d = document.createElement('div');
    d.className='msg file-msg';
    d.innerHTML=`<div class="who">${esc(data.uploaded_by)} شارك ملف</div>
        <a href="/api/download/${encodeURIComponent(data.saved_as)}" target="_blank">&#128193; ${esc(data.name)} (${fmtSize(data.size)})</a>`;
    c.appendChild(d);
    c.scrollTop = c.scrollHeight;
}

function addShared(data){
    let el = document.getElementById('sharedFiles');
    let d = document.createElement('div');
    d.style.cssText='padding:6px 8px;border-bottom:1px solid var(--border);font-size:.78em;';
    d.innerHTML=`<a href="/api/download/${encodeURIComponent(data.saved_as)}" target="_blank" style="color:var(--accent);text-decoration:none;">
        &#128193; ${esc(data.name)}</a><br><span style="color:var(--dim)">${fmtSize(data.size)}</span>`;
    el.prepend(d);
}

// --- File Upload ---
function sendFile(){
    let f = document.getElementById('fileIn').files[0];
    if(!f) return;
    let form = new FormData();
    form.append('file',f); form.append('username',me);
    if(selRoom) form.append('room_id', selRoom);

    let bar = document.getElementById('uploadBar');
    let fill = document.getElementById('pFill');
    let name = document.getElementById('pName');
    let pct = document.getElementById('pPct');
    bar.classList.add('on');

    let xhr = new XMLHttpRequest();
    xhr.open('POST','/api/upload');
    xhr.upload.onprogress = e=>{
        if(e.lengthComputable){
            let p = Math.round(e.loaded/e.total*100);
            fill.style.width=p+'%'; pct.textContent=p+'%';
            name.textContent=f.name+' ('+fmtSize(e.loaded)+'/'+fmtSize(e.total)+')';
        }
    };
    xhr.onload = ()=>{ bar.classList.remove('on'); document.getElementById('fileIn').value=''; };
    xhr.onerror = ()=>{ bar.classList.remove('on'); sysMsg('فشل رفع الملف'); };
    xhr.send(form);
}

// --- WebRTC ---
async function startCall(type){
    if(!selUser){ sysMsg('اختر مستخدم'); return; }
    window._callType = type;
    try {
        localStream = await navigator.mediaDevices.getUserMedia({
            audio:{echoCancellation:true,noiseSuppression:true},
            video: type==='video' ? {width:{ideal:1280},height:{ideal:720}} : false,
        });
    } catch(e){ sysMsg('فشل الوصول للجهاز: '+e.message); return; }
    document.getElementById('localVid').srcObject = localStream;
    if(type==='video') document.getElementById('vidArea').classList.add('on');
    document.getElementById('hangupBtn').style.display='flex';
    inCall = selUser;
    socket.emit('call_request',{target:selUser, sender_name:me, call_type:type});
    sysMsg('جاري الاتصال...');
}

async function acceptCall(){
    document.getElementById('callPopup').classList.remove('on');
    stopRing();
    let type = window._callType || 'video';
    try {
        localStream = await navigator.mediaDevices.getUserMedia({
            audio:{echoCancellation:true,noiseSuppression:true},
            video: type==='video' ? {width:{ideal:1280},height:{ideal:720}} : false,
        });
    } catch(e){ sysMsg('فشل الوصول للجهاز'); return; }
    document.getElementById('localVid').srcObject = localStream;
    if(type==='video') document.getElementById('vidArea').classList.add('on');
    document.getElementById('hangupBtn').style.display='flex';
    socket.emit('call_accept',{target:inCall});
}

function rejectCall(){
    document.getElementById('callPopup').classList.remove('on');
    stopRing();
    socket.emit('call_reject',{target:inCall});
    inCall=null;
}

async function createOffer(target){
    iceQ=[];
    pc = new RTCPeerConnection(iceConfig);
    setupPC(target);
    localStream.getTracks().forEach(t=> pc.addTrack(t,localStream));
    let offer = await pc.createOffer();
    await pc.setLocalDescription(offer);
    socket.emit('webrtc_offer',{sdp:offer.sdp, type:offer.type, target});
}

async function handleOffer(d){
    iceQ=[];
    pc = new RTCPeerConnection(iceConfig);
    setupPC(d.sender);
    if(localStream) localStream.getTracks().forEach(t=> pc.addTrack(t,localStream));
    await pc.setRemoteDescription(new RTCSessionDescription({sdp:d.sdp,type:d.type}));
    for(let c of iceQ) try{ await pc.addIceCandidate(new RTCIceCandidate(c)); }catch(e){}
    iceQ=[];
    let answer = await pc.createAnswer();
    await pc.setLocalDescription(answer);
    socket.emit('webrtc_answer',{sdp:answer.sdp, type:answer.type, target:d.sender});
}

async function handleAnswer(d){
    if(!pc) return;
    await pc.setRemoteDescription(new RTCSessionDescription({sdp:d.sdp,type:d.type}));
    for(let c of iceQ) try{ await pc.addIceCandidate(new RTCIceCandidate(c)); }catch(e){}
    iceQ=[];
}

async function handleIce(d){
    if(d.candidate){
        if(pc && pc.remoteDescription) try{ await pc.addIceCandidate(new RTCIceCandidate(d.candidate)); }catch(e){}
        else iceQ.push(d.candidate);
    }
}

function setupPC(target){
    pc.onicecandidate = e=>{ if(e.candidate) socket.emit('webrtc_ice',{candidate:e.candidate,target}); };
    pc.ontrack = e=>{
        document.getElementById('remoteVid').srcObject = e.streams[0];
        if(e.track.kind === 'video') document.getElementById('vidArea').classList.add('on');
    };
    pc.onconnectionstatechange = ()=>{
        if(pc.connectionState==='connected'){ sysMsg('تم الاتصال'); startCallTimer(); }
        if(pc.connectionState==='failed'||pc.connectionState==='disconnected'){ sysMsg('انقطع الاتصال'); cleanup(); }
    };
}

function endCall(){
    socket.emit('call_end',{target:inCall});
    cleanup();
}

function cleanup(){
    stopRing();
    stopCallTimer();
    if(pc){ pc.close(); pc=null; }
    if(localStream){ localStream.getTracks().forEach(t=>t.stop()); localStream=null; }
    inCall=null; iceQ=[]; micOn=true; camOn=true;
    document.getElementById('localVid').srcObject=null;
    document.getElementById('remoteVid').srcObject=null;
    document.getElementById('vidArea').classList.remove('on');
    document.getElementById('hangupBtn').style.display='none';
    document.getElementById('callPopup').classList.remove('on');
    document.getElementById('micBtn').classList.remove('off');
    document.getElementById('camBtn').classList.remove('off');
}

function toggleMic(){
    if(!localStream) return;
    micOn=!micOn;
    localStream.getAudioTracks().forEach(t=>t.enabled=micOn);
    document.getElementById('micBtn').classList.toggle('off',!micOn);
}

function toggleCam(){
    if(!localStream) return;
    camOn=!camOn;
    localStream.getVideoTracks().forEach(t=>t.enabled=camOn);
    document.getElementById('camBtn').classList.toggle('off',!camOn);
}

function fmtSize(b){ if(b<1024)return b+' B'; if(b<1048576)return(b/1024).toFixed(1)+' KB'; return(b/1048576).toFixed(1)+' MB'; }
function esc(s){ let d=document.createElement('div'); d.textContent=s; return d.innerHTML; }
</script>
