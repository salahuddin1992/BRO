<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>هيلين WiFi</title>
<style>
* { margin:0; padding:0; box-sizing:border-box; }
:root { --bg:#0a0a1a; --card:rgba(255,255,255,0.04); --border:rgba(255,255,255,0.08);
        --text:#e0e0e0; --dim:rgba(255,255,255,0.4); --accent:#00d4ff; --green:#00e676; --red:#ff5252; }
body { font-family:'Segoe UI',Tahoma,sans-serif; background:var(--bg); color:var(--text); height:100vh; overflow:hidden; }

/* Login */
.login { position:fixed; inset:0; background:rgba(0,0,0,0.85); display:flex; align-items:center; justify-content:center; z-index:100; }
.login.hide { display:none; }
.login-box { background:var(--card); border:1px solid var(--border); border-radius:16px; padding:40px; text-align:center; width:320px; }
.login-box h2 { color:var(--accent); margin-bottom:20px; }
.login-box input { width:100%; padding:12px; background:rgba(255,255,255,0.07); border:1px solid var(--border);
                   border-radius:10px; color:#fff; font-size:1em; outline:none; margin-bottom:14px; }
.login-box button { width:100%; padding:12px; background:linear-gradient(135deg,#00d4ff,#0066ff); border:none;
                    border-radius:10px; color:#fff; font-size:1em; cursor:pointer; }

/* Layout */
.app { display:grid; grid-template-columns:220px 1fr 260px; height:100vh; }

/* Users */
.users { background:rgba(255,255,255,0.02); border-left:1px solid var(--border); padding:14px; overflow-y:auto; }
.sec-title { font-size:.78em; color:var(--dim); text-transform:uppercase; letter-spacing:1px; margin-bottom:10px;
             padding-bottom:6px; border-bottom:1px solid var(--border); }
.user { display:flex; align-items:center; gap:8px; padding:8px 10px; border-radius:8px; cursor:pointer; margin-bottom:3px; }
.user:hover { background:rgba(255,255,255,0.04); }
.user.sel { background:rgba(0,212,255,0.1); }
.avatar { width:32px; height:32px; background:linear-gradient(135deg,#00d4ff,#0066ff); border-radius:50%;
          display:flex; align-items:center; justify-content:center; font-weight:bold; font-size:.85em; }
.uname { font-size:.85em; }
.rbadge { font-size:.58em; background:rgba(0,212,255,0.15); color:var(--accent); padding:1px 5px; border-radius:6px; margin-right:4px; vertical-align:middle; }

/* Center */
.center { display:flex; flex-direction:column; }
.topbar { display:flex; align-items:center; justify-content:space-between; padding:10px 18px; border-bottom:1px solid var(--border); }
.topbar .target { font-size:.9em; color:var(--dim); }
.btns { display:flex; gap:6px; }
.cbtn { width:38px; height:38px; border-radius:50%; border:none; cursor:pointer; font-size:1.1em;
        display:flex; align-items:center; justify-content:center; }
.cbtn.voice { background:var(--green); color:#fff; }
.cbtn.video { background:var(--accent); color:#fff; }
.cbtn.hangup { background:var(--red); color:#fff; display:none; }

/* Video */
.vid-area { display:none; background:#000; position:relative; max-height:45vh; }
.vid-area.on { display:flex; }
#remoteVid { width:100%; height:100%; object-fit:cover; }
#localVid { position:absolute; bottom:10px; left:10px; width:150px; border-radius:8px; border:2px solid var(--accent); z-index:5; }
.vid-ctrl { position:absolute; bottom:10px; left:50%; transform:translateX(-50%); display:flex; gap:10px; z-index:5; }
.vbtn { width:42px; height:42px; border-radius:50%; border:none; cursor:pointer; font-size:1.1em;
        background:rgba(255,255,255,0.15); color:#fff; }
.vbtn.off { background:var(--red); }

/* Chat */
.chat { flex:1; display:flex; flex-direction:column; min-height:0; }
.msgs { flex:1; overflow-y:auto; padding:14px 18px; }
.msg { max-width:65%; padding:9px 14px; border-radius:14px; margin-bottom:6px; font-size:.88em; line-height:1.4; word-wrap:break-word; }
.msg.out { background:linear-gradient(135deg,#0066ff,#00d4ff); margin-left:auto; color:#fff; }
.msg.in { background:rgba(255,255,255,0.07); margin-right:auto; }
.msg .who { font-size:.72em; color:rgba(255,255,255,0.4); margin-bottom:3px; }
.msg .when { font-size:.68em; color:rgba(255,255,255,0.25); margin-top:3px; direction:ltr; text-align:left; }
.sys { text-align:center; color:var(--dim); font-size:.78em; padding:6px; }
.file-msg { background:rgba(0,212,255,0.08); border:1px solid rgba(0,212,255,0.15); }
.file-msg a { color:var(--accent); text-decoration:none; }

/* Upload progress */
.upload-bar { display:none; padding:6px 18px; border-top:1px solid var(--border); }
.upload-bar.on { display:block; }
.pbar { width:100%; height:5px; background:rgba(255,255,255,0.08); border-radius:3px; overflow:hidden; }
.pfill { height:100%; background:linear-gradient(90deg,#00d4ff,#0066ff); width:0%; transition:width .2s; }
.ptext { font-size:.72em; color:var(--dim); margin-top:3px; display:flex; justify-content:space-between; }

/* Input */
.input-row { display:flex; gap:8px; padding:10px 18px; border-top:1px solid var(--border); align-items:center; }
.input-row input[type=text] { flex:1; padding:10px 14px; background:rgba(255,255,255,0.06); border:1px solid var(--border);
                              border-radius:20px; color:#fff; font-size:.9em; outline:none; }
.input-row input:focus { border-color:var(--accent); }
.sbtn { width:40px; height:40px; border-radius:50%; border:none; background:linear-gradient(135deg,#00d4ff,#0066ff);
        color:#fff; font-size:1.1em; cursor:pointer; }
.fbtn { width:40px; height:40px; border-radius:50%; border:1px solid var(--border); background:transparent;
        color:var(--dim); font-size:1.1em; cursor:pointer; }

/* Info panel */
.info { background:rgba(255,255,255,0.02); border-right:1px solid var(--border); padding:14px; overflow-y:auto; }
.info-card { background:rgba(0,212,255,0.04); border:1px solid rgba(0,212,255,0.08); border-radius:10px; padding:14px; margin-bottom:14px; }
.info-card h3 { color:var(--accent); font-size:.82em; margin-bottom:6px; }
.irow { display:flex; justify-content:space-between; padding:4px 0; font-size:.78em; border-bottom:1px solid rgba(255,255,255,0.03); }
.irow .l { color:var(--dim); }
.irow .v { direction:ltr; font-family:monospace; }

/* Incoming call */
.call-popup { position:fixed; inset:0; background:rgba(0,0,0,0.85); display:none; align-items:center; justify-content:center; z-index:200; }
.call-popup.on { display:flex; }
.call-card { text-align:center; padding:40px; }
.call-card h2 { color:var(--accent); margin-bottom:8px; }
.call-card p { color:var(--dim); margin-bottom:24px; }
.call-card .row { display:flex; gap:20px; justify-content:center; }
.call-card button { width:56px; height:56px; border-radius:50%; border:none; cursor:pointer; font-size:1.4em; }
.acc { background:var(--green); color:#fff; }
.rej { background:var(--red); color:#fff; }

@media(max-width:768px) { .app{grid-template-columns:1fr;} .users,.info{display:none;} }
</style>
</head>
<body>

<!-- Login -->
<div class="login" id="login">
    <div class="login-box">
        <h2>هيلين WiFi</h2>
        <input id="nameIn" placeholder="اسمك" autofocus>
        <button onclick="doLogin()">دخول</button>
    </div>
</div>

<!-- Incoming Call -->
<div class="call-popup" id="callPopup">
    <div class="call-card">
        <h2 id="callerName">مكالمة واردة</h2>
        <p id="callTypeText">مكالمة فيديو</p>
        <div class="row">
            <button class="acc" onclick="acceptCall()">&#128222;</button>
            <button class="rej" onclick="rejectCall()">&#10005;</button>
        </div>
    </div>
</div>

<!-- App -->
<div class="app">
    <div class="users">
        <div class="sec-title">المتصلون</div>
        <div id="userList"></div>
    </div>

    <div class="center">
        <div class="topbar">
            <span class="target" id="chatTarget">غرفة عامة</span>
            <div class="btns">
                <button class="cbtn voice" onclick="startCall('audio')" title="صوت">&#128222;</button>
                <button class="cbtn video" onclick="startCall('video')" title="فيديو">&#127909;</button>
                <button class="cbtn hangup" id="hangupBtn" onclick="endCall()">&#10005;</button>
            </div>
        </div>

        <div class="vid-area" id="vidArea">
            <video id="remoteVid" autoplay playsinline></video>
            <video id="localVid" autoplay muted playsinline></video>
            <div class="vid-ctrl">
                <button class="vbtn" id="micBtn" onclick="toggleMic()">&#127908;</button>
                <button class="vbtn" id="camBtn" onclick="toggleCam()">&#127909;</button>
                <button class="vbtn off" onclick="endCall()">&#10005;</button>
            </div>
        </div>

        <div class="chat">
            <div class="msgs" id="msgs"></div>
            <div class="upload-bar" id="uploadBar">
                <div class="pbar"><div class="pfill" id="pFill"></div></div>
                <div class="ptext"><span id="pName">...</span><span id="pPct">0%</span></div>
            </div>
            <div class="input-row">
                <input type="file" id="fileIn" style="display:none" onchange="sendFile()">
                <button class="fbtn" onclick="document.getElementById('fileIn').click()">&#128206;</button>
                <input type="text" id="msgIn" placeholder="اكتب رسالتك..." onkeydown="if(event.key==='Enter')sendMsg()">
                <button class="sbtn" onclick="sendMsg()">&#10148;</button>
            </div>
        </div>
    </div>

    <div class="info">
        <div class="sec-title">معلومات</div>
        <div class="info-card">
            <h3>السيرفر</h3>
            <div class="irow"><span class="l">المعرف</span><span class="v" id="iServerId">--</span></div>
            <div class="irow"><span class="l">الاتصال</span><span class="v" id="iFiber">--</span></div>
        </div>
        <div class="info-card">
            <h3>احصائيات</h3>
            <div class="irow"><span class="l">متصلون</span><span class="v" id="iOnline">0</span></div>
            <div class="irow"><span class="l">رسائل</span><span class="v" id="iMsgs">0</span></div>
            <div class="irow"><span class="l">ملفات</span><span class="v" id="iFiles">0</span></div>
        </div>
        <div class="sec-title" style="margin-top:14px;">ملفات مشتركة</div>
        <div id="sharedFiles"></div>
    </div>
</div>

<script src="/static/js/socket.io.min.js"></script>
<script>
let socket, me, selUser=null, selName=null;
let localStream, pc, inCall=null;
let micOn=true, camOn=true;
let msgCount=0, fileCount=0;
let iceQ = [];
let lastUsers = [];

let iceConfig = {iceServers:[
    {urls:'stun:stun.l.google.com:19302'},
    {urls:'stun:stun1.l.google.com:19302'},
    {urls:'turn:openrelay.metered.ca:80',username:'openrelayproject',credential:'openrelayproject'},
    {urls:'turn:openrelay.metered.ca:443',username:'openrelayproject',credential:'openrelayproject'},
    {urls:'turn:openrelay.metered.ca:443?transport=tcp',username:'openrelayproject',credential:'openrelayproject'},
]};

document.getElementById('nameIn').addEventListener('keydown', e=>{ if(e.key==='Enter') doLogin(); });

function doLogin(){
    me = document.getElementById('nameIn').value.trim();
    if(!me) return;
    document.getElementById('login').classList.add('hide');
    initSocket();
}

function initSocket(){
    socket = io({reconnection:true, reconnectionDelay:1000, reconnectionAttempts:Infinity});

    socket.on('connect', ()=> socket.emit('register',{username:me}));

    socket.on('server_info', d=>{
        document.getElementById('iServerId').textContent = d.server_id;
        if(d.ice_servers) iceConfig.iceServers = d.ice_servers;
        document.getElementById('iFiber').textContent = d.is_fiber ? 'فايبر' : 'عادي';
        document.getElementById('iFiber').style.color = d.is_fiber ? 'var(--green)' : '';
    });

    socket.on('users_online', d=>{
        lastUsers = d.users;
        renderUsers(d.users);
        document.getElementById('iOnline').textContent = d.users.length;
    });

    socket.on('user_offline', d=>{
        if(d.username) sysMsg(d.username+' غادر');
        if(d.sid===inCall){ sysMsg('انتهت المكالمة'); cleanup(); }
    });

    socket.on('chat_message', d=>{
        msgCount++;
        document.getElementById('iMsgs').textContent = msgCount;
        addMsg(d.sender, d.text, d.sender===me, d.timestamp);
    });

    socket.on('file_shared', d=>{
        fileCount++;
        document.getElementById('iFiles').textContent = fileCount;
        fileMsg(d);
        addShared(d);
    });

    // WebRTC
    socket.on('incoming_call', d=>{
        inCall = d.sender;
        document.getElementById('callerName').textContent = d.sender_name;
        document.getElementById('callTypeText').textContent = d.call_type==='video'?'مكالمة فيديو':'مكالمة صوتية';
        document.getElementById('callPopup').classList.add('on');
        window._callType = d.call_type;
    });

    socket.on('call_accepted', async d=>{ await createOffer(d.sender); });
    socket.on('call_rejected', ()=>{ sysMsg('تم رفض المكالمة'); cleanup(); });
    socket.on('call_ended', ()=>{ sysMsg('انتهت المكالمة'); cleanup(); });
    socket.on('webrtc_offer', async d=> await handleOffer(d));
    socket.on('webrtc_answer', async d=> await handleAnswer(d));
    socket.on('webrtc_ice', async d=> await handleIce(d));
}

function renderUsers(users){
    document.getElementById('userList').innerHTML = users.filter(u=>u.username!==me).map(u=>
        `<div class="user ${selUser===u.sid?'sel':''}" onclick="pickUser('${u.sid}','${esc(u.username)}')">
            <div class="avatar">${u.username[0].toUpperCase()}</div>
            <div class="uname">${esc(u.username)}${u.remote?'<span class="rbadge">mesh</span>':''}</div>
        </div>`
    ).join('');
}

function pickUser(sid,name){
    selUser = selUser===sid ? null : sid;
    selName = selUser ? name : null;
    document.getElementById('chatTarget').textContent = selUser ? 'محادثة مع '+name : 'غرفة عامة';
    renderUsers(lastUsers);
}

function sendMsg(){
    let input = document.getElementById('msgIn');
    let text = input.value.trim();
    if(!text) return;
    socket.emit('chat_message',{sender:me, text, target:selUser});
    input.value='';
}

function addMsg(sender,text,mine,ts){
    let c = document.getElementById('msgs');
    let t = ts ? new Date(ts+'Z').toLocaleTimeString('ar-SA') : '';
    let d = document.createElement('div');
    d.className = 'msg '+(mine?'out':'in');
    d.innerHTML = (mine?'':`<div class="who">${esc(sender)}</div>`)+`<div>${esc(text)}</div><div class="when">${t}</div>`;
    c.appendChild(d);
    c.scrollTop = c.scrollHeight;
}

function sysMsg(text){
    let c = document.getElementById('msgs');
    let d = document.createElement('div');
    d.className='sys'; d.textContent=text;
    c.appendChild(d);
    c.scrollTop = c.scrollHeight;
}

function fileMsg(data){
    let c = document.getElementById('msgs');
    let d = document.createElement('div');
    d.className='msg file-msg';
    d.innerHTML=`<div class="who">${esc(data.uploaded_by)} شارك ملف</div>
        <a href="/api/download/${encodeURIComponent(data.saved_as)}" target="_blank">&#128193; ${esc(data.name)} (${fmtSize(data.size)})</a>`;
    c.appendChild(d);
    c.scrollTop = c.scrollHeight;
}

function addShared(data){
    let el = document.getElementById('sharedFiles');
    let d = document.createElement('div');
    d.style.cssText='padding:6px 8px;border-bottom:1px solid var(--border);font-size:.78em;';
    d.innerHTML=`<a href="/api/download/${encodeURIComponent(data.saved_as)}" target="_blank" style="color:var(--accent);text-decoration:none;">
        &#128193; ${esc(data.name)}</a><br><span style="color:var(--dim)">${fmtSize(data.size)}</span>`;
    el.prepend(d);
}

// File Upload
function sendFile(){
    let f = document.getElementById('fileIn').files[0];
    if(!f) return;
    let form = new FormData();
    form.append('file',f); form.append('username',me);

    let bar = document.getElementById('uploadBar');
    let fill = document.getElementById('pFill');
    let name = document.getElementById('pName');
    let pct = document.getElementById('pPct');
    bar.classList.add('on');

    let xhr = new XMLHttpRequest();
    xhr.open('POST','/api/upload');
    xhr.upload.onprogress = e=>{
        if(e.lengthComputable){
            let p = Math.round(e.loaded/e.total*100);
            fill.style.width=p+'%'; pct.textContent=p+'%';
            name.textContent=f.name+' ('+fmtSize(e.loaded)+'/'+fmtSize(e.total)+')';
        }
    };
    xhr.onload = ()=>{ bar.classList.remove('on'); document.getElementById('fileIn').value=''; };
    xhr.onerror = ()=>{ bar.classList.remove('on'); sysMsg('فشل رفع الملف'); };
    xhr.send(form);
}

// WebRTC
async function startCall(type){
    if(!selUser){ sysMsg('اختر مستخدم'); return; }
    window._callType = type;
    try {
        localStream = await navigator.mediaDevices.getUserMedia({
            audio:{echoCancellation:true,noiseSuppression:true},
            video: type==='video' ? {width:{ideal:1280},height:{ideal:720}} : false,
        });
    } catch(e){ sysMsg('فشل الوصول للجهاز: '+e.message); return; }
    document.getElementById('localVid').srcObject = localStream;
    if(type==='video') document.getElementById('vidArea').classList.add('on');
    document.getElementById('hangupBtn').style.display='flex';
    inCall = selUser;
    socket.emit('call_request',{target:selUser, sender_name:me, call_type:type});
    sysMsg('جاري الاتصال...');
}

async function acceptCall(){
    document.getElementById('callPopup').classList.remove('on');
    let type = window._callType || 'video';
    try {
        localStream = await navigator.mediaDevices.getUserMedia({
            audio:{echoCancellation:true,noiseSuppression:true},
            video: type==='video' ? {width:{ideal:1280},height:{ideal:720}} : false,
        });
    } catch(e){ sysMsg('فشل الوصول للجهاز'); return; }
    document.getElementById('localVid').srcObject = localStream;
    if(type==='video') document.getElementById('vidArea').classList.add('on');
    document.getElementById('hangupBtn').style.display='flex';
    socket.emit('call_accept',{target:inCall});
}

function rejectCall(){
    document.getElementById('callPopup').classList.remove('on');
    socket.emit('call_reject',{target:inCall});
    inCall=null;
}

async function createOffer(target){
    iceQ=[];
    pc = new RTCPeerConnection(iceConfig);
    setupPC(target);
    localStream.getTracks().forEach(t=> pc.addTrack(t,localStream));
    let offer = await pc.createOffer();
    await pc.setLocalDescription(offer);
    socket.emit('webrtc_offer',{sdp:offer.sdp, type:offer.type, target});
}

async function handleOffer(d){
    iceQ=[];
    pc = new RTCPeerConnection(iceConfig);
    setupPC(d.sender);
    if(localStream) localStream.getTracks().forEach(t=> pc.addTrack(t,localStream));
    await pc.setRemoteDescription(new RTCSessionDescription({sdp:d.sdp,type:d.type}));
    for(let c of iceQ) try{ await pc.addIceCandidate(new RTCIceCandidate(c)); }catch(e){}
    iceQ=[];
    let answer = await pc.createAnswer();
    await pc.setLocalDescription(answer);
    socket.emit('webrtc_answer',{sdp:answer.sdp, type:answer.type, target:d.sender});
}

async function handleAnswer(d){
    if(!pc) return;
    await pc.setRemoteDescription(new RTCSessionDescription({sdp:d.sdp,type:d.type}));
    for(let c of iceQ) try{ await pc.addIceCandidate(new RTCIceCandidate(c)); }catch(e){}
    iceQ=[];
}

async function handleIce(d){
    if(d.candidate){
        if(pc && pc.remoteDescription) try{ await pc.addIceCandidate(new RTCIceCandidate(d.candidate)); }catch(e){}
        else iceQ.push(d.candidate);
    }
}

function setupPC(target){
    pc.onicecandidate = e=>{ if(e.candidate) socket.emit('webrtc_ice',{candidate:e.candidate,target}); };
    pc.ontrack = e=>{
        document.getElementById('remoteVid').srcObject = e.streams[0];
        // Only show video area for video calls, not audio-only
        if(e.track.kind === 'video') document.getElementById('vidArea').classList.add('on');
    };
    pc.onconnectionstatechange = ()=>{
        if(pc.connectionState==='connected') sysMsg('تم الاتصال');
        if(pc.connectionState==='failed'||pc.connectionState==='disconnected'){ sysMsg('انقطع الاتصال'); cleanup(); }
    };
}

function endCall(){
    socket.emit('call_end',{target:inCall});
    cleanup();
}

function cleanup(){
    if(pc){ pc.close(); pc=null; }
    if(localStream){ localStream.getTracks().forEach(t=>t.stop()); localStream=null; }
    inCall=null; iceQ=[]; micOn=true; camOn=true;
    document.getElementById('localVid').srcObject=null;
    document.getElementById('remoteVid').srcObject=null;
    document.getElementById('vidArea').classList.remove('on');
    document.getElementById('hangupBtn').style.display='none';
    document.getElementById('callPopup').classList.remove('on');
    document.getElementById('micBtn').classList.remove('off');
    document.getElementById('camBtn').classList.remove('off');
}

function toggleMic(){
    if(!localStream) return;
    micOn=!micOn;
    localStream.getAudioTracks().forEach(t=>t.enabled=micOn);
    document.getElementById('micBtn').classList.toggle('off',!micOn);
}

function toggleCam(){
    if(!localStream) return;
    camOn=!camOn;
    localStream.getVideoTracks().forEach(t=>t.enabled=camOn);
    document.getElementById('camBtn').classList.toggle('off',!camOn);
}

function fmtSize(b){ if(b<1024)return b+' B'; if(b<1048576)return(b/1024).toFixed(1)+' KB'; return(b/1048576).toFixed(1)+' MB'; }
function esc(s){ let d=document.createElement('div'); d.textContent=s; return d.innerHTML; }
</script>
</body>
</html>
