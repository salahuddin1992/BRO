<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>هيلين WiFi - واجهة الاتصال</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        :root {
            --bg: #0a0a1a;
            --card: rgba(255,255,255,0.04);
            --border: rgba(255,255,255,0.08);
            --text: #e0e0e0;
            --text2: rgba(255,255,255,0.5);
            --accent: #00d4ff;
            --green: #00e676;
            --red: #ff5252;
        }
        body {
            font-family: 'Segoe UI', Tahoma, sans-serif;
            background: var(--bg);
            color: var(--text);
            min-height: 100vh;
            overflow: hidden;
        }

        /* Login overlay */
        .login-overlay {
            position: fixed;
            inset: 0;
            background: rgba(0,0,0,0.8);
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 1000;
        }
        .login-overlay.hidden { display: none; }
        .login-form {
            background: rgba(255,255,255,0.05);
            backdrop-filter: blur(20px);
            border: 1px solid var(--border);
            border-radius: 16px;
            padding: 40px;
            text-align: center;
            width: 350px;
        }
        .login-form h2 { color: var(--accent); margin-bottom: 20px; }
        .login-form input {
            width: 100%;
            padding: 12px;
            background: rgba(255,255,255,0.08);
            border: 1px solid var(--border);
            border-radius: 10px;
            color: white;
            font-size: 1em;
            margin-bottom: 16px;
            outline: none;
        }
        .login-form input:focus { border-color: var(--accent); }
        .login-form button {
            width: 100%;
            padding: 12px;
            background: linear-gradient(135deg, #00d4ff, #0066ff);
            border: none;
            border-radius: 10px;
            color: white;
            font-size: 1em;
            cursor: pointer;
        }

        /* Layout */
        .app-layout {
            display: grid;
            grid-template-columns: 260px 1fr 300px;
            height: 100vh;
        }

        /* Left panel - Users */
        .users-panel {
            background: rgba(255,255,255,0.02);
            border-left: 1px solid var(--border);
            padding: 16px;
            overflow-y: auto;
        }
        .panel-heading {
            font-size: 0.85em;
            color: var(--text2);
            text-transform: uppercase;
            letter-spacing: 1px;
            margin-bottom: 12px;
            padding-bottom: 8px;
            border-bottom: 1px solid var(--border);
        }
        .user-item {
            display: flex;
            align-items: center;
            gap: 10px;
            padding: 10px 12px;
            border-radius: 10px;
            cursor: pointer;
            transition: background 0.2s;
            margin-bottom: 4px;
        }
        .user-item:hover { background: rgba(255,255,255,0.05); }
        .user-item.selected { background: rgba(0,212,255,0.1); }
        .user-avatar {
            width: 36px; height: 36px;
            background: linear-gradient(135deg, #00d4ff, #0066ff);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: bold;
            font-size: 0.9em;
        }
        .user-name { font-size: 0.9em; }
        .user-status { font-size: 0.7em; color: var(--green); }

        /* Center - Main area */
        .center-panel {
            display: flex;
            flex-direction: column;
            height: 100vh;
        }

        /* Top bar */
        .top-bar {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 12px 20px;
            border-bottom: 1px solid var(--border);
        }
        .top-bar .info { font-size: 0.9em; color: var(--text2); }
        .call-btns { display: flex; gap: 8px; }
        .call-btn {
            width: 40px; height: 40px;
            border-radius: 50%;
            border: none;
            cursor: pointer;
            font-size: 1.2em;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: transform 0.2s;
        }
        .call-btn:hover { transform: scale(1.1); }
        .call-btn.voice { background: var(--green); color: white; }
        .call-btn.video { background: var(--accent); color: white; }
        .call-btn.end { background: var(--red); color: white; display: none; }

        /* Video area */
        .video-area {
            display: none;
            background: #000;
            position: relative;
            flex: 1;
            max-height: 50vh;
        }
        .video-area.active { display: flex; }
        .video-area video {
            flex: 1;
            max-height: 100%;
            object-fit: cover;
        }
        #localVideo {
            position: absolute;
            bottom: 16px;
            left: 16px;
            width: 180px;
            height: 135px;
            border-radius: 10px;
            border: 2px solid var(--accent);
            z-index: 10;
            object-fit: cover;
        }
        #remoteVideo { width: 100%; height: 100%; }
        .video-controls {
            position: absolute;
            bottom: 16px;
            left: 50%;
            transform: translateX(-50%);
            display: flex;
            gap: 12px;
            z-index: 10;
        }
        .vc-btn {
            width: 48px; height: 48px;
            border-radius: 50%;
            border: none;
            cursor: pointer;
            font-size: 1.2em;
            background: rgba(255,255,255,0.15);
            color: white;
            backdrop-filter: blur(10px);
        }
        .vc-btn.active { background: var(--red); }
        .vc-btn:hover { background: rgba(255,255,255,0.25); }

        /* Chat area */
        .chat-area {
            flex: 1;
            display: flex;
            flex-direction: column;
            min-height: 0;
        }
        .messages-container {
            flex: 1;
            overflow-y: auto;
            padding: 16px 20px;
        }
        .message {
            max-width: 70%;
            padding: 10px 16px;
            border-radius: 16px;
            margin-bottom: 8px;
            font-size: 0.9em;
            line-height: 1.4;
            word-wrap: break-word;
        }
        .message.sent {
            background: linear-gradient(135deg, #0066ff, #00d4ff);
            margin-left: auto;
            border-bottom-left: 4px;
            color: white;
        }
        .message.received {
            background: rgba(255,255,255,0.08);
            margin-right: auto;
            border-bottom-right: 4px;
        }
        .message .msg-sender {
            font-size: 0.75em;
            color: rgba(255,255,255,0.5);
            margin-bottom: 4px;
        }
        .message .msg-time {
            font-size: 0.7em;
            color: rgba(255,255,255,0.3);
            margin-top: 4px;
            text-align: left;
            direction: ltr;
        }
        .message.file-msg {
            background: rgba(0,212,255,0.1);
            border: 1px solid rgba(0,212,255,0.2);
        }
        .file-link {
            color: var(--accent);
            text-decoration: none;
        }
        .file-link:hover { text-decoration: underline; }

        /* Input area */
        .input-area {
            display: flex;
            gap: 10px;
            padding: 12px 20px;
            border-top: 1px solid var(--border);
            align-items: center;
        }
        .input-area input[type=text] {
            flex: 1;
            padding: 12px 16px;
            background: rgba(255,255,255,0.06);
            border: 1px solid var(--border);
            border-radius: 24px;
            color: white;
            font-size: 0.95em;
            outline: none;
        }
        .input-area input[type=text]:focus { border-color: var(--accent); }
        .send-btn {
            width: 44px; height: 44px;
            border-radius: 50%;
            border: none;
            background: linear-gradient(135deg, #00d4ff, #0066ff);
            color: white;
            font-size: 1.2em;
            cursor: pointer;
        }
        .file-btn {
            width: 44px; height: 44px;
            border-radius: 50%;
            border: 1px solid var(--border);
            background: transparent;
            color: var(--text2);
            font-size: 1.2em;
            cursor: pointer;
        }
        .file-btn:hover { background: rgba(255,255,255,0.05); color: var(--accent); }

        /* Upload progress */
        .upload-progress {
            display: none;
            padding: 8px 20px;
            border-top: 1px solid var(--border);
        }
        .upload-progress.active { display: block; }
        .progress-bar {
            width: 100%;
            height: 6px;
            background: rgba(255,255,255,0.1);
            border-radius: 3px;
            overflow: hidden;
        }
        .progress-fill {
            height: 100%;
            background: linear-gradient(90deg, #00d4ff, #0066ff);
            width: 0%;
            transition: width 0.2s;
            border-radius: 3px;
        }
        .progress-text {
            font-size: 0.75em;
            color: var(--text2);
            margin-top: 4px;
            display: flex;
            justify-content: space-between;
        }

        /* Right panel - Info */
        .info-panel {
            background: rgba(255,255,255,0.02);
            border-right: 1px solid var(--border);
            padding: 16px;
            overflow-y: auto;
        }
        .server-info-card {
            background: rgba(0,212,255,0.05);
            border: 1px solid rgba(0,212,255,0.1);
            border-radius: 12px;
            padding: 16px;
            margin-bottom: 16px;
        }
        .server-info-card h3 {
            color: var(--accent);
            font-size: 0.85em;
            margin-bottom: 8px;
        }
        .info-row {
            display: flex;
            justify-content: space-between;
            padding: 6px 0;
            font-size: 0.8em;
            border-bottom: 1px solid rgba(255,255,255,0.03);
        }
        .info-row .label { color: var(--text2); }
        .info-row .val { direction: ltr; font-family: monospace; }

        /* Incoming call overlay */
        .call-overlay {
            position: fixed;
            inset: 0;
            background: rgba(0,0,0,0.85);
            display: none;
            align-items: center;
            justify-content: center;
            z-index: 2000;
        }
        .call-overlay.active { display: flex; }
        .call-card {
            text-align: center;
            padding: 40px;
        }
        .call-card h2 { color: var(--accent); margin-bottom: 8px; }
        .call-card p { color: var(--text2); margin-bottom: 30px; }
        .call-card .btns { display: flex; gap: 20px; justify-content: center; }
        .call-card .btns button {
            width: 60px; height: 60px;
            border-radius: 50%;
            border: none;
            cursor: pointer;
            font-size: 1.5em;
        }
        .accept-btn { background: var(--green); color: white; }
        .reject-btn { background: var(--red); color: white; }

        @media (max-width: 768px) {
            .app-layout { grid-template-columns: 1fr; }
            .users-panel, .info-panel { display: none; }
        }
    </style>
</head>
<body>
    <!-- Login Overlay -->
    <div class="login-overlay" id="loginOverlay">
        <div class="login-form">
            <h2>هيلين WiFi</h2>
            <p style="color:var(--text2); margin-bottom:20px; font-size:0.9em;">ادخل اسمك للاتصال</p>
            <input type="text" id="usernameInput" placeholder="اسم المستخدم" autofocus>
            <button onclick="doLogin()">اتصال</button>
        </div>
    </div>

    <!-- Incoming Call Overlay -->
    <div class="call-overlay" id="callOverlay">
        <div class="call-card">
            <h2 id="callerName">مكالمة واردة</h2>
            <p id="callType">مكالمة فيديو</p>
            <div class="btns">
                <button class="accept-btn" onclick="acceptCall()">&#128222;</button>
                <button class="reject-btn" onclick="rejectCall()">&#10005;</button>
            </div>
        </div>
    </div>

    <!-- Main App -->
    <div class="app-layout">
        <!-- Users Panel -->
        <div class="users-panel">
            <div class="panel-heading">المستخدمون المتصلون</div>
            <div id="usersList"></div>
        </div>

        <!-- Center Panel -->
        <div class="center-panel">
            <div class="top-bar">
                <div class="info">
                    <span id="chatTarget">غرفة عامة</span>
                </div>
                <div class="call-btns">
                    <button class="call-btn voice" onclick="startCall('audio')" title="مكالمة صوتية">&#128222;</button>
                    <button class="call-btn video" onclick="startCall('video')" title="مكالمة فيديو">&#127909;</button>
                    <button class="call-btn end" id="endCallBtn" onclick="endCall()" title="انهاء المكالمة">&#10005;</button>
                </div>
            </div>

            <div class="video-area" id="videoArea">
                <video id="remoteVideo" autoplay playsinline></video>
                <video id="localVideo" autoplay muted playsinline></video>
                <div class="video-controls">
                    <button class="vc-btn" id="toggleMic" onclick="toggleMic()">&#127908;</button>
                    <button class="vc-btn" id="toggleCam" onclick="toggleCam()">&#127909;</button>
                    <button class="vc-btn active" onclick="endCall()">&#10005;</button>
                </div>
            </div>

            <div class="chat-area">
                <div class="messages-container" id="messagesContainer"></div>
                <div class="upload-progress" id="uploadProgress">
                    <div class="progress-bar"><div class="progress-fill" id="progressFill"></div></div>
                    <div class="progress-text"><span id="progressText">جاري الرفع...</span><span id="progressPercent">0%</span></div>
                </div>
                <div class="input-area">
                    <input type="file" id="fileInput" style="display:none" onchange="sendFile()">
                    <button class="file-btn" onclick="document.getElementById('fileInput').click()">&#128206;</button>
                    <input type="text" id="msgInput" placeholder="اكتب رسالتك..." onkeydown="if(event.key==='Enter')sendMessage()">
                    <button class="send-btn" onclick="sendMessage()">&#10148;</button>
                </div>
            </div>
        </div>

        <!-- Info Panel -->
        <div class="info-panel">
            <div class="panel-heading">معلومات الاتصال</div>
            <div class="server-info-card">
                <h3>السيرفر</h3>
                <div class="info-row"><span class="label">المعرف</span><span class="val" id="infoServerId">--</span></div>
                <div class="info-row"><span class="label">الحالة</span><span class="val" style="color:var(--green);">متصل</span></div>
            </div>
            <div class="server-info-card">
                <h3>احصائيات</h3>
                <div class="info-row"><span class="label">المتصلون</span><span class="val" id="infoOnline">0</span></div>
                <div class="info-row"><span class="label">الرسائل</span><span class="val" id="infoMsgs">0</span></div>
                <div class="info-row"><span class="label">الملفات</span><span class="val" id="infoFiles">0</span></div>
            </div>
            <div class="panel-heading" style="margin-top:16px;">الملفات المشتركة</div>
            <div id="sharedFiles"></div>
        </div>
    </div>

    <script src="/static/js/socket.io.min.js"></script>
    <script>
        // WebRTC browser compatibility shim
        if (!navigator.mediaDevices) navigator.mediaDevices = {};
        if (!navigator.mediaDevices.getUserMedia) {
            navigator.mediaDevices.getUserMedia = function(c) {
                var gum = navigator.webkitGetUserMedia || navigator.mozGetUserMedia;
                if (!gum) return Promise.reject(new Error('getUserMedia not supported'));
                return new Promise(function(resolve, reject) { gum.call(navigator, c, resolve, reject); });
            };
        }
        window.RTCPeerConnection = window.RTCPeerConnection || window.webkitRTCPeerConnection || window.mozRTCPeerConnection;
        window.RTCSessionDescription = window.RTCSessionDescription || window.mozRTCSessionDescription;
        window.RTCIceCandidate = window.RTCIceCandidate || window.mozRTCIceCandidate;
    </script>
    <script>
        let socket, username, selectedUser = null;
        let localStream, peerConnection, incomingCallData;
        let messageCount = 0, fileCount = 0;
        let micEnabled = true, camEnabled = true;
        let currentCallTarget = null; // track who we're in a call with

        const iceConfig = { iceServers: [
            { urls: 'stun:stun.l.google.com:19302' },
            { urls: 'stun:stun1.l.google.com:19302' },
        ]};

        function doLogin() {
            username = document.getElementById('usernameInput').value.trim();
            if (!username) return;
            document.getElementById('loginOverlay').classList.add('hidden');
            initSocket();
        }

        document.getElementById('usernameInput').addEventListener('keydown', e => {
            if (e.key === 'Enter') doLogin();
        });

        function initSocket() {
            socket = io({ transports: ['websocket', 'polling'] });

            socket.on('connect', () => {
                socket.emit('register', { username });
            });

            socket.on('server_info', data => {
                document.getElementById('infoServerId').textContent = data.server_id;
                if (data.ice_servers) iceConfig.iceServers = data.ice_servers;
            });

            socket.on('users_online', data => {
                renderUsers(data.users);
                document.getElementById('infoOnline').textContent = data.users.length;
            });

            socket.on('user_joined', data => {
                addSystemMessage(data.username + ' انضم');
            });

            socket.on('user_left', data => {
                addSystemMessage('مستخدم غادر');
            });

            socket.on('user_offline', data => {
                if (data.username) addSystemMessage(data.username + ' غادر');
            });

            socket.on('chat_message', data => {
                messageCount++;
                document.getElementById('infoMsgs').textContent = messageCount;
                const isMine = data.sender === username;
                addMessage(data.sender, data.text, isMine, data.timestamp);
            });

            socket.on('file_shared', data => {
                fileCount++;
                document.getElementById('infoFiles').textContent = fileCount;
                addFileMessage(data);
                addSharedFile(data);
            });

            // WebRTC signaling
            socket.on('incoming_call', data => {
                incomingCallData = data;
                document.getElementById('callerName').textContent = data.sender_name;
                document.getElementById('callType').textContent =
                    data.call_type === 'video' ? 'مكالمة فيديو' : 'مكالمة صوتية';
                document.getElementById('callOverlay').classList.add('active');
            });

            socket.on('call_accepted', async data => {
                await createOffer(data.sender);
            });

            socket.on('call_rejected', () => {
                addSystemMessage('تم رفض المكالمة');
                cleanupCall();
            });

            socket.on('call_ended', () => {
                addSystemMessage('انتهت المكالمة');
                cleanupCall();
            });

            socket.on('webrtc_offer', async data => {
                await handleOffer(data);
            });

            socket.on('webrtc_answer', async data => {
                await handleAnswer(data);
            });

            socket.on('webrtc_ice', async data => {
                await handleIce(data);
            });
        }

        function renderUsers(users) {
            const el = document.getElementById('usersList');
            el.innerHTML = users.filter(u => u.username !== username).map(u => `
                <div class="user-item ${selectedUser === u.sid ? 'selected' : ''}"
                     onclick="selectUser('${u.sid}', '${u.username}', this)">
                    <div class="user-avatar">${u.username[0].toUpperCase()}</div>
                    <div>
                        <div class="user-name">${u.username}</div>
                        <div class="user-status">متصل</div>
                    </div>
                </div>
            `).join('');
        }

        function selectUser(sid, name, el) {
            selectedUser = selectedUser === sid ? null : sid;
            document.getElementById('chatTarget').textContent =
                selectedUser ? 'محادثة مع ' + name : 'غرفة عامة';
            document.querySelectorAll('.user-item').forEach(e => e.classList.remove('selected'));
            if (selectedUser && el) {
                el.classList.add('selected');
            }
        }

        function sendMessage() {
            const input = document.getElementById('msgInput');
            const text = input.value.trim();
            if (!text || !socket) return;
            socket.emit('chat_message', {
                sender: username,
                text: text,
                target: selectedUser,
            });
            input.value = '';
        }

        function addMessage(sender, text, isMine, timestamp) {
            const container = document.getElementById('messagesContainer');
            const time = timestamp ? new Date(timestamp + 'Z').toLocaleTimeString('ar-SA') : '';
            const div = document.createElement('div');
            div.className = 'message ' + (isMine ? 'sent' : 'received');
            div.innerHTML = `
                ${!isMine ? '<div class="msg-sender">' + sender + '</div>' : ''}
                <div>${escapeHtml(text)}</div>
                <div class="msg-time">${time}</div>
            `;
            container.appendChild(div);
            container.scrollTop = container.scrollHeight;
        }

        function addSystemMessage(text) {
            const container = document.getElementById('messagesContainer');
            const div = document.createElement('div');
            div.style.cssText = 'text-align:center; color:var(--text2); font-size:0.8em; padding:8px;';
            div.textContent = text;
            container.appendChild(div);
            container.scrollTop = container.scrollHeight;
        }

        function addFileMessage(data) {
            const container = document.getElementById('messagesContainer');
            const div = document.createElement('div');
            div.className = 'message file-msg';
            div.innerHTML = `
                <div class="msg-sender">${data.uploaded_by} شارك ملف</div>
                <div><a class="file-link" href="/api/download/${data.saved_as}" target="_blank">
                    &#128193; ${data.name} (${formatSize(data.size)})</a></div>
            `;
            container.appendChild(div);
            container.scrollTop = container.scrollHeight;
        }

        function addSharedFile(data) {
            const el = document.getElementById('sharedFiles');
            const div = document.createElement('div');
            div.style.cssText = 'padding:8px 10px; border-bottom:1px solid var(--border); font-size:0.8em;';
            div.innerHTML = `<a class="file-link" href="/api/download/${data.saved_as}" target="_blank">
                &#128193; ${data.name}</a><br><span style="color:var(--text2)">${formatSize(data.size)}</span>`;
            el.prepend(div);
        }

        function sendFile() {
            const input = document.getElementById('fileInput');
            if (!input.files.length) return;
            const file = input.files[0];
            const form = new FormData();
            form.append('file', file);
            form.append('username', username);

            const progressEl = document.getElementById('uploadProgress');
            const fillEl = document.getElementById('progressFill');
            const textEl = document.getElementById('progressText');
            const percentEl = document.getElementById('progressPercent');

            progressEl.classList.add('active');
            textEl.textContent = file.name;
            fillEl.style.width = '0%';
            percentEl.textContent = '0%';

            const xhr = new XMLHttpRequest();
            xhr.open('POST', '/api/upload');

            xhr.upload.onprogress = (e) => {
                if (e.lengthComputable) {
                    const pct = Math.round((e.loaded / e.total) * 100);
                    fillEl.style.width = pct + '%';
                    percentEl.textContent = pct + '%';
                    textEl.textContent = file.name + ' (' + formatSize(e.loaded) + ' / ' + formatSize(e.total) + ')';
                }
            };

            xhr.onload = () => {
                progressEl.classList.remove('active');
                if (xhr.status === 200) {
                    const data = JSON.parse(xhr.responseText);
                    if (data.error) addSystemMessage('خطأ: ' + data.error);
                } else {
                    addSystemMessage('فشل رفع الملف');
                }
            };

            xhr.onerror = () => {
                progressEl.classList.remove('active');
                addSystemMessage('فشل رفع الملف - خطأ بالشبكة');
            };

            xhr.send(form);
            input.value = '';
        }

        // ---- WebRTC ----
        async function startCall(type) {
            if (!selectedUser) {
                addSystemMessage('اختر مستخدم للاتصال');
                return;
            }
            const constraints = type === 'video'
                ? { audio: true, video: { width: { ideal: 4096 }, height: { ideal: 2160 }, frameRate: { ideal: 60 } } }
                : { audio: true, video: false };
            try {
                localStream = await navigator.mediaDevices.getUserMedia(constraints);
                document.getElementById('localVideo').srcObject = localStream;
                if (type === 'video') {
                    document.getElementById('videoArea').classList.add('active');
                }
                document.getElementById('endCallBtn').style.display = 'flex';

                currentCallTarget = selectedUser;
                socket.emit('call_request', {
                    target: selectedUser,
                    sender_name: username,
                    call_type: type,
                });
            } catch (e) {
                addSystemMessage('فشل الوصول للكاميرا/الميكروفون');
            }
        }

        async function acceptCall() {
            document.getElementById('callOverlay').classList.remove('active');
            const type = incomingCallData.call_type;
            const constraints = type === 'video'
                ? { audio: true, video: { width: { ideal: 4096 }, height: { ideal: 2160 }, frameRate: { ideal: 60 } } }
                : { audio: true, video: false };
            try {
                localStream = await navigator.mediaDevices.getUserMedia(constraints);
                document.getElementById('localVideo').srcObject = localStream;
                if (type === 'video') {
                    document.getElementById('videoArea').classList.add('active');
                }
                document.getElementById('endCallBtn').style.display = 'flex';

                currentCallTarget = incomingCallData.sender;
                socket.emit('call_accept', {
                    target: incomingCallData.sender,
                    room_id: incomingCallData.room_id,
                });
            } catch (e) {
                addSystemMessage('فشل الوصول للكاميرا/الميكروفون');
            }
        }

        function rejectCall() {
            document.getElementById('callOverlay').classList.remove('active');
            socket.emit('call_reject', { target: incomingCallData.sender });
            incomingCallData = null;
        }

        async function createOffer(targetSid) {
            peerConnection = new RTCPeerConnection(iceConfig);
            setupPeerConnection(targetSid);
            localStream.getTracks().forEach(track => peerConnection.addTrack(track, localStream));
            const offer = await peerConnection.createOffer();
            await peerConnection.setLocalDescription(offer);
            // Remove bandwidth limits from SDP for max quality
            const unlimitedSdp = removeBandwidthLimits(offer.sdp);
            socket.emit('webrtc_offer', {
                sdp: unlimitedSdp,
                type: offer.type,
                target: targetSid,
            });
        }

        async function handleOffer(data) {
            peerConnection = new RTCPeerConnection(iceConfig);
            setupPeerConnection(data.sender);
            if (localStream) {
                localStream.getTracks().forEach(track => peerConnection.addTrack(track, localStream));
            }
            await peerConnection.setRemoteDescription(new RTCSessionDescription({
                sdp: data.sdp, type: data.type
            }));
            const answer = await peerConnection.createAnswer();
            await peerConnection.setLocalDescription(answer);
            socket.emit('webrtc_answer', {
                sdp: answer.sdp,
                type: answer.type,
                target: data.sender,
            });
        }

        async function handleAnswer(data) {
            if (peerConnection) {
                await peerConnection.setRemoteDescription(new RTCSessionDescription({
                    sdp: data.sdp, type: data.type
                }));
            }
        }

        async function handleIce(data) {
            if (peerConnection && data.candidate) {
                try {
                    await peerConnection.addIceCandidate(new RTCIceCandidate(data.candidate));
                } catch (e) {}
            }
        }

        function setupPeerConnection(targetSid) {
            peerConnection.onicecandidate = e => {
                if (e.candidate) {
                    socket.emit('webrtc_ice', {
                        candidate: e.candidate,
                        target: targetSid,
                    });
                }
            };
            peerConnection.ontrack = e => {
                document.getElementById('remoteVideo').srcObject = e.streams[0];
            };
            peerConnection.onconnectionstatechange = () => {
                if (peerConnection.connectionState === 'disconnected' ||
                    peerConnection.connectionState === 'failed') {
                    cleanupCall();
                }
            };
        }

        function endCall() {
            socket.emit('call_end', { target: currentCallTarget });
            cleanupCall();
        }

        function cleanupCall() {
            if (peerConnection) { peerConnection.close(); peerConnection = null; }
            if (localStream) {
                localStream.getTracks().forEach(t => t.stop());
                localStream = null;
            }
            currentCallTarget = null;
            document.getElementById('localVideo').srcObject = null;
            document.getElementById('remoteVideo').srcObject = null;
            document.getElementById('videoArea').classList.remove('active');
            document.getElementById('endCallBtn').style.display = 'none';
            document.getElementById('callOverlay').classList.remove('active');
            micEnabled = true; camEnabled = true;
        }

        function toggleMic() {
            if (!localStream) return;
            micEnabled = !micEnabled;
            localStream.getAudioTracks().forEach(t => t.enabled = micEnabled);
            document.getElementById('toggleMic').classList.toggle('active', !micEnabled);
        }

        function toggleCam() {
            if (!localStream) return;
            camEnabled = !camEnabled;
            localStream.getVideoTracks().forEach(t => t.enabled = camEnabled);
            document.getElementById('toggleCam').classList.toggle('active', !camEnabled);
        }

        function removeBandwidthLimits(sdp) {
            // Remove any b=AS: or b=TIAS: lines that cap bandwidth
            return sdp.replace(/b=AS:.*\r\n/g, '').replace(/b=TIAS:.*\r\n/g, '');
        }

        function formatSize(b) {
            if (b < 1024) return b + ' B';
            if (b < 1048576) return (b/1024).toFixed(1) + ' KB';
            if (b < 1073741824) return (b/1048576).toFixed(1) + ' MB';
            return (b/1073741824).toFixed(2) + ' GB';
        }

        function escapeHtml(s) {
            const d = document.createElement('div');
            d.textContent = s;
            return d.innerHTML;
        }
    </script>
</body>
