<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>هيلين WiFi - تغيير كلمة المرور</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Segoe UI', Tahoma, sans-serif;
            background: linear-gradient(135deg, #0f0c29, #302b63, #24243e);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .login-box {
            background: rgba(255,255,255,0.05);
            backdrop-filter: blur(20px);
            border: 1px solid rgba(255,255,255,0.1);
            border-radius: 20px;
            padding: 50px 40px;
            width: 420px;
            text-align: center;
        }
        .login-box h1 { color: #00d4ff; font-size: 1.8em; margin-bottom: 10px; }
        .login-box p { color: rgba(255,255,255,0.6); margin-bottom: 30px; font-size: 0.95em; }
        .warning {
            background: rgba(255,165,0,0.15);
            border: 1px solid rgba(255,165,0,0.3);
            color: #ffb347;
            padding: 12px;
            border-radius: 8px;
            margin-bottom: 20px;
            font-size: 0.9em;
        }
        .form-group {
            margin-bottom: 20px;
            text-align: right;
        }
        .form-group label {
            color: rgba(255,255,255,0.8);
            display: block;
            margin-bottom: 8px;
            font-size: 0.9em;
        }
        .form-group input {
            width: 100%;
            padding: 12px 16px;
            background: rgba(255,255,255,0.08);
            border: 1px solid rgba(255,255,255,0.15);
            border-radius: 10px;
            color: white;
            font-size: 1em;
            outline: none;
            transition: border 0.3s;
        }
        .form-group input:focus { border-color: #00d4ff; }
        .btn {
            width: 100%;
            padding: 14px;
            background: linear-gradient(135deg, #00d4ff, #0066ff);
            border: none;
            border-radius: 10px;
            color: white;
            font-size: 1.1em;
            cursor: pointer;
            transition: transform 0.2s, box-shadow 0.2s;
            margin-top: 10px;
        }
        .btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 20px rgba(0,212,255,0.3);
        }
        .error {
            background: rgba(255,50,50,0.2);
            border: 1px solid rgba(255,50,50,0.3);
            color: #ff6b6b;
            padding: 10px;
            border-radius: 8px;
            margin-bottom: 20px;
            font-size: 0.9em;
        }
        .hint {
            color: rgba(255,255,255,0.4);
            font-size: 0.8em;
            margin-top: 6px;
        }
    </style>
</head>
<body>
    <div class="login-box">
        <h1>هيلين WiFi</h1>
        <div class="warning">
            كلمة المرور الافتراضية غير آمنة. يجب تغييرها قبل المتابعة.
        </div>
        <p>اختر كلمة مرور قوية للمدير</p>

        {% if error %}
        <div class="error">{{ error }}</div>
        {% endif %}

        <form method="POST">
            <div class="form-group">
                <label>كلمة المرور الجديدة</label>
                <input type="password" name="new_password" autocomplete="new-password" required autofocus>
                <div class="hint">6 أحرف على الأقل، حروف + أرقام</div>
            </div>
            <div class="form-group">
                <label>تأكيد كلمة المرور</label>
                <input type="password" name="confirm_password" autocomplete="new-password" required>
            </div>
            <button type="submit" class="btn">تغيير كلمة المرور</button>
        </form>
    </div>
</body>
</html>
